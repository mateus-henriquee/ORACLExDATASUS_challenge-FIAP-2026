<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Cientista de Dados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">✳</span>
        <span class="brand-name">DataMind</span>
      </div>

      <button id="new-tab" class="new-chat-btn">
        <span class="plus">+</span> Nova conversa
      </button>

      <div class="tabs-label">Conversas</div>
      <div id="tabs" class="tabs-list"></div>

      <div class="sidebar-footer">
        <span class="dot"></span> Modelo local · CPU
      </div>
    </aside>

    <main class="main">
      <header class="chat-header">
        <h1 id="chat-title">Selecione ou crie uma conversa</h1>
        <label class="upload-btn" for="csv-file">
          <span>⤒</span> CSV
          <input type="file" id="csv-file" accept=".csv" hidden>
        </label>
      </header>

      <div id="chat-window" class="chat-window">
        <div class="empty-state" id="empty-state">
          <div class="empty-mark">✳</div>
          <p>Crie uma aba e envie um CSV, ou pergunte algo sobre seus dados.</p>
        </div>
      </div>

      <form id="message-form" class="composer">
        <input type="text" id="question" placeholder="Pergunte algo sobre os dados..." autocomplete="off">
        <button type="submit" class="send-btn" aria-label="Enviar">➤</button>
      </form>
    </main>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"
          onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js';document.head.appendChild(s);"></script>
  <script src="app.js"></script>
</body>
</html>
